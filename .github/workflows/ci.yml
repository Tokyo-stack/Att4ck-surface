name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev + live extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,live]"

      - name: Lint (ruff)
        run: ruff check attack_surface tests

      - name: Type-check (mypy)
        run: mypy attack_surface

      - name: Test (pytest)
        run: pytest -q

      - name: Smoke test the CLI
        run: |
          att4ck --version
          att4ck surfaces --json > /dev/null
          att4ck scan test_sandbox --no-banner -q --no-export
          # Baseline round-trip: recording then re-scanning must report 0 new findings.
          att4ck scan test_sandbox --no-banner -q --update-baseline /tmp/base.json
          att4ck scan test_sandbox --no-banner -q --baseline /tmp/base.json --no-export --fail-on critical
